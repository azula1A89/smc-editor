name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            cmake \
            pkg-config \
            python3 \
            gawk \
            flex \
            bison \
            libexpat1-dev \
            zlib1g-dev \
            libcairo2-dev \
            libpango1.0-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libx11-dev \
            libxcursor-dev \
            libxinerama-dev \
            libxrandr-dev \
            libxi-dev \
            libwayland-dev \
            libxkbcommon-dev

      - name: Configure and build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
          cmake --build build

      - name: Verify bundled dependencies are statically linked
        run: |
          if ldd build/smc-editor | grep -E '=> .*/build/(_deps|deps)/'; then
            echo "smc-editor dynamically links a dependency built from deps/." >&2
            exit 1
          fi

      - name: Package executable
        run: tar -czf smc-editor-linux-x86_64.tar.gz -C build smc-editor

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: smc-editor-linux-x86_64.tar.gz

  build-windows:
    runs-on: windows-2025
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: 74f5ea45ca78988784b810ad9bbb148ea7ff76d8

      - name: Download and verify Windows dependency cache
        shell: pwsh
        run: |
          $archive = "$env:RUNNER_TEMP/smc-editor-windows-x64-vcpkg-cache.zip"
          $expected = "4ff013866631d895bc3726ef41f3dd54ecdc87ffe54ff334357d2dbc4c47b921"
          $url = "https://github.com/azula1A89/smc-editor-windows-deps/releases/download/v0.1.0/smc-editor-windows-x64-vcpkg-cache.zip"
          Invoke-WebRequest -Uri $url -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ine $expected) {
            throw "Windows dependency package checksum mismatch."
          }
          $destination = "$env:RUNNER_TEMP/smc-deps"
          New-Item -ItemType Directory -Force $destination | Out-Null
          tar -xf $archive -C $destination
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path "$destination/cache" -PathType Container)) {
            throw "Windows dependency package does not contain a cache directory."
          }

      - name: Configure and build
        shell: pwsh
        env:
          VCPKG_BINARY_SOURCES: clear;files,${{ runner.temp }}/smc-deps/cache,read
        run: |
          $maxAttempts = 3
          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            cmake -S . -B build -DBUILD_TESTING=OFF `
              -DVCPKG_TARGET_TRIPLET=x64-windows-static `
              -DSMC_EDITOR_USE_RELEASE_PKGCONFIG=ON `
              -DVCPKG_INSTALL_OPTIONS=--only-binarycaching `
              "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
            if ($LASTEXITCODE -eq 0) {
              break
            }
            if ($attempt -eq $maxAttempts) {
              exit $LASTEXITCODE
            }
            $delay = 5 * $attempt
            Write-Host "CMake configure failed with exit code $LASTEXITCODE; retrying in $delay seconds (attempt $($attempt + 1) of $maxAttempts)."
            Start-Sleep -Seconds $delay
          }
          cmake --build build --config Release

      - name: Verify standalone executable
        shell: pwsh
        run: |
          $exe = Resolve-Path build/Release/smc-editor.exe
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsInstall = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          $dumpbin = Get-ChildItem "$vsInstall\VC\Tools\MSVC" `
            -Recurse -Filter dumpbin.exe |
            Where-Object { $_.FullName -match '\\Hostx64\\x64\\dumpbin.exe$' } |
            Select-Object -Last 1
          if (-not $dumpbin) {
            throw "dumpbin.exe was not found in the Visual Studio installation."
          }
          $dependencies = & $dumpbin.FullName /DEPENDENTS $exe |
            Where-Object { $_ -match '^\s+\S+\.dll\s*$' } |
            ForEach-Object { $_.Trim() }
          $nonSystem = $dependencies |
            Where-Object { $_ -notmatch '^(KERNEL32|USER32|GDI32|SHELL32|OLE32|OLEAUT32|ADVAPI32|COMDLG32|WINSPOOL|OPENGL32|GLU32|IMM32|VERSION|SHLWAPI|WINMM|WS2_32|DWRITE|CRYPT32|BCRYPT|RPCRT4|DWMAPI|UXTHEME|SETUPAPI|DBGHELP|MSIMG32|USERENV|NTDLL)\.dll$' }
          if ($nonSystem) {
            throw "smc-editor.exe has external DLL dependencies: $($nonSystem -join ', ')"
          }
          if ((Get-ChildItem build/Release -File -Filter *.dll).Count -ne 0) {
            throw "The release output contains DLL files."
          }

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: build/Release/smc-editor.exe
